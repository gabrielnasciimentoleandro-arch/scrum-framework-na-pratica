<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Pilares e valores do Scrum</title>
  <desc id="desc">Transparência, inspeção e adaptação sustentadas pelos cinco valores do Scrum.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f7fc"/>
      <stop offset="1" stop-color="#eeecfa"/>
    </linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#777b98"/></marker>
  </defs>
  <rect width="1200" height="650" rx="28" fill="#f4f5fb"/>
  <g font-family="DejaVu Sans, Arial, sans-serif">
    <text x="600" y="58" text-anchor="middle" fill="#252844" font-size="29" font-weight="800">Empirismo em movimento</text>
    <text x="600" y="88" text-anchor="middle" fill="#68708a" font-size="15">valores tornam os pilares observáveis nas decisões diárias</text>
    <g transform="translate(80 145)">
      <g transform="translate(0 0)">
        <circle cx="150" cy="145" r="132" fill="#e9e5ff" stroke="#6b4eff" stroke-width="5"/>
        <circle cx="150" cy="86" r="28" fill="#6b4eff"/>
        <text x="150" y="94" text-anchor="middle" fill="#fff" font-size="22" font-weight="800">1</text>
        <text x="150" y="137" text-anchor="middle" fill="#46358d" font-size="24" font-weight="800">TRANSPARÊNCIA</text>
        <text x="150" y="171" text-anchor="middle" fill="#5f6380" font-size="14">tornar trabalho, metas</text>
        <text x="150" y="193" text-anchor="middle" fill="#5f6380" font-size="14">e qualidade visíveis</text>
      </g>
      <g transform="translate(360 0)">
        <circle cx="150" cy="145" r="132" fill="#e4f6f2" stroke="#13a085" stroke-width="5"/>
        <circle cx="150" cy="86" r="28" fill="#13a085"/>
        <text x="150" y="94" text-anchor="middle" fill="#fff" font-size="22" font-weight="800">2</text>
        <text x="150" y="137" text-anchor="middle" fill="#087360" font-size="24" font-weight="800">INSPEÇÃO</text>
        <text x="150" y="171" text-anchor="middle" fill="#5f6380" font-size="14">comparar evidências</text>
        <text x="150" y="193" text-anchor="middle" fill="#5f6380" font-size="14">com metas e expectativas</text>
      </g>
      <g transform="translate(720 0)">
        <circle cx="150" cy="145" r="132" fill="#fff0ec" stroke="#f06449" stroke-width="5"/>
        <circle cx="150" cy="86" r="28" fill="#f06449"/>
        <text x="150" y="94" text-anchor="middle" fill="#fff" font-size="22" font-weight="800">3</text>
        <text x="150" y="137" text-anchor="middle" fill="#b74331" font-size="24" font-weight="800">ADAPTAÇÃO</text>
        <text x="150" y="171" text-anchor="middle" fill="#5f6380" font-size="14">ajustar produto e modo</text>
        <text x="150" y="193" text-anchor="middle" fill="#5f6380" font-size="14">de trabalhar rapidamente</text>
      </g>
      <g fill="#777b98">
        <rect x="290" y="143" width="72" height="4" rx="2"/>
        <rect x="650" y="143" width="72" height="4" rx="2"/>
        <rect x="150" y="306" width="720" height="4" rx="2"/>
        <rect x="868" y="286" width="4" height="22" rx="2"/>
        <rect x="148" y="286" width="4" height="22" rx="2"/>
        <path d="M374 145l-14-9v18z"/><path d="M734 145l-14-9v18z"/><path d="M150 280l-9 14h18z"/>
      </g>
    </g>
    <g transform="translate(113 500)">
      <text x="487" y="-30" text-anchor="middle" fill="#252844" font-size="18" font-weight="800">CINCO VALORES</text>
      <g fill="#fff" font-size="15" font-weight="700" text-anchor="middle">
        <rect width="180" height="54" rx="27" fill="#6b4eff"/><text x="90" y="33">COMPROMISSO</text>
        <rect x="200" width="150" height="54" rx="27" fill="#13a085"/><text x="275" y="33">FOCO</text>
        <rect x="370" width="170" height="54" rx="27" fill="#f06449"/><text x="455" y="33">ABERTURA</text>
        <rect x="560" width="170" height="54" rx="27" fill="#d08a18"/><text x="645" y="33">RESPEITO</text>
        <rect x="750" width="170" height="54" rx="27" fill="#443589"/><text x="835" y="33">CORAGEM</text>
      </g>
      <text x="460" y="90" text-anchor="middle" fill="#68708a" font-size="14">sem valores, os eventos podem virar cerimônias sem aprendizado</text>
    </g>
  </g>
</svg>
